# Artifact map for STOCK AChoirX Windows collections — VALIDATED against a real stock
# collection (ACQ-IR-<host>, AChoirX 2026). Select it with --artifact-map on `check` and
# `investigate`:
#     python main.py check --artifact-map config/artifact_map.stock.yaml <collection_dir>
#
# Differences vs the DC33 custom layout (config/artifact_map.yaml):
#   - autoruns:  Arn -> ASEP   (stock writes ASEP CSVs: ASEP-All.csv, AllHKUS.csv, SchedTask.csv, …)
#   - prefetch:  stock has BOTH  Prf (real .pf prefetch — 100s of files) AND RanProg (MZ copies of
#                run programs, like DC33's "Ranprog"; note the capital P — matching is case-sensitive)
#   - sysinfo:   Sys -> SYS    (SRUDB.dat PLUS extra: hosts / services / GPResult / env vars / hotfixes)
#   - NEW:       PCA           (Program Compatibility Assistant: PcaAppLaunchDic.txt / PcaGeneralDb*.txt)
#   - the acquisition log is a loose top-level file (<host>.Log), not a Logs/ folder; Rcy often absent.
#
# UNCHANGED and therefore compatible: stock bundles the SAME export tools
# (BrowsingHistoryView / BrowserDownloadsView / ExtractUSNJrnl), so Brw and RawData CSV formats
# are identical; binary formats (EVTX/registry/SRUM/LNK/$MFT) are standard; Amcache is still
# collected under Reg/ and matched by filename.
artifacts:
  ASEP:    { type: autoruns,           parser: null }   # autostart entries as CSV (stock's "Arn")
  Brw:     { type: browser,            parser: browser }
  Conn:    { type: network,            parser: null }
  Evt:     { type: event_logs,         parser: evtx }
  Lnk:     { type: lnk,                parser: lnk }
  Logs:    { type: acquisition_log,    parser: null }   # stock writes a loose <host>.Log file instead
  MemDump: { type: memory,             parser: null }
  PCA:     { type: pca_appcompat,      parser: null }   # NEW: Program Compatibility Assistant exec history
  Prf:     { type: prefetch,           parser: null }   # real Windows prefetch (.pf) — execution evidence
  Proc:    { type: process_listings,   parser: null }
  Psh:     { type: powershell_history, parser: psh }
  RanProg: { type: runprog_copies,     parser: null }   # MZ copies of run programs (orig path + MD5 in name)
  RawData: { type: mft_usn,            parser: usn }     # USNJrnl.csv (ExtractUSNJrnl) + $MFT
  Reg:     { type: registry,           parser: registry }
  Sch:     { type: scheduled_tasks,    parser: null }
  SYS:     { type: srum_sysinfo,       parser: srum }    # SRUDB.dat + hosts/services/GPResult/env/hotfixes
  WMI:     { type: wmi,                parser: null }
