# Maps the triage dir-codes to artifact types and parsers — the ADAPTER for a collection's
# layout. This map matches the DC33 OBSIDIAN custom AChoirX collector.
#
# For a different layout, copy this file, rename/add codes, and select it with
# `--artifact-map <path>`. A ready-made `artifact_map.stock.yaml` is provided for STOCK
# AChoirX output. Before a full run on a new/unfamiliar collection, preflight it with:
#     python main.py check [--artifact-map <map>] <collection_dir>
# (reports recognized vs unknown dir-codes and whether each parser finds its inputs).
#
# parser: the extraction module under src/extraction (null = not yet implemented;
#         the dir is still cataloged for coverage + the file-metadata index so the
#         agent can still POINT at files inside it).
artifacts:
  Arn:     { type: amcache_autoruns,   parser: null }
  Brw:     { type: browser,            parser: browser }
  Conn:    { type: network,            parser: null }
  Evt:     { type: event_logs,         parser: evtx }
  Lnk:     { type: lnk,                parser: lnk }
  Logs:    { type: acquisition_log,    parser: null }
  MemDump: { type: memory,             parser: null }
  Proc:    { type: process_listings,   parser: null }
  Psh:     { type: powershell_history, parser: psh }
  Ranprog: { type: prefetch,           parser: null }
  RawData: { type: mft_usn,            parser: usn }   # USN journal (curated); full $MFT not parsed
  Rcy:     { type: recycle_bin,        parser: null }
  Reg:     { type: registry,           parser: registry }
  Sch:     { type: scheduled_tasks,    parser: null }
  Sys:     { type: srum_sysinfo,       parser: srum }   # SRUDB.dat; text exports also agent-readable
  WMI:     { type: wmi,                parser: null }
