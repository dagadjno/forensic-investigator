# forensic-investigator configuration.
#
# Models are selected per ROLE. Each role picks a provider + model, so you can mix
# providers and drop a high-volume role to a cheaper model with a one-line change.
# provider: anthropic | openai | gemini  (install the matching SDK — see README extras)
# Currently only the 'subagent' role drives the LLM; the others are forward-looking.
# Optional per-role `effort` (low|medium|high|max) overrides llm.effort below.
# The sub-agent makes many sequential tool-call rounds, so a lower effort there is
# the single biggest speed/cost lever — raise it if you want deeper triage.
models:
  orchestrator: { provider: anthropic, model: claude-sonnet-4-6, effort: low }
  subagent:     { provider: anthropic, model: claude-sonnet-4-6, effort: low }
  report:       { provider: anthropic, model: claude-sonnet-4-6 }
  verifier:     { provider: anthropic, model: claude-sonnet-4-6 }
  # --- examples: swap a role to another provider ---
  # subagent: { provider: openai, model: gpt-5 }
  # subagent: { provider: gemini, model: gemini-2.5-pro }

llm:
  # Adaptive thinking + effort, per the Anthropic API guidance.
  effort: high
  max_tokens: 16000

budgets:
  # Run-to-completion, but with progress invariants so it terminates.
  max_subagent_steps: 20     # tool-call rounds per sub-agent before it must conclude
  max_lead_depth: 4          # how deep a filed-lead chain may go
  max_total_leads: 60        # hard stop against runaway lead generation (per host)
  # Bound the cost of an UNANSWERABLE question: an agent can chase a single question through
  # only so many follow-up leads before further file_lead calls are refused (it must conclude
  # with what it has). The question still gets every bucket via the coverage sweep.
  max_leads_per_question: 8
  # Wall-clock ceiling per host: after this many minutes the orchestrator stops popping new
  # leads and writes the report with whatever's answered so far (answers commit live, so
  # nothing is lost). Guards against a runaway burning an hour on one host. 0 = no ceiling.
  max_host_minutes: 25

memory:
  # On-demand Volatility3 analysis of the MemDump image, exposed as the `vol_run` tool.
  # OPT-IN: when disabled (or Volatility not reachable), memory questions degrade to POINTER
  # and nothing heavy runs. Keeps the core disk-triage tool fully portable.
  enabled: true
  # How to invoke Volatility3 on THIS machine. List form so it works for a venv exe, a
  # system 'vol', or a docker run. A relative first element resolves against the repo root.
  vol_cmd: [".venv-vol/Scripts/vol.exe"]
  # Per-image plugin JSON cache (a re-run of the same plugin is free). Safe to delete.
  cache_dir: output/_memcache

paths:
  knowledge_base: knowledge_base
  output: output
