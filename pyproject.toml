[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-investigator"
version = "0.1.0"
description = "Agentic, LLM-driven investigator for Windows IR triage collections."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "anthropic>=0.69",
    # Deterministic artifact parsers — kept in sync with requirements.txt (see its notes).
    "evtx>=0.12",            # Rust-backed EVTX (fast; parser falls back to python-evtx if absent)
    "python-registry>=1.3",  # registry hives
    "LnkParse3>=1.4",        # .lnk shortcuts
    "dissect.esedb>=3.0",    # SRUM (SRUDB.dat is an ESE database)
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all = ["openai>=1.40", "google-genai>=1.0"]

[project.scripts]
forensic-investigator = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src", "src.store", "src.extraction", "src.llm", "src.llm.backends",
            "src.tools", "src.agents", "src.report"]
